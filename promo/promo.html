<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universe IPTV Promo</title>
<style>
  @font-face { font-family: "Orbitron"; font-weight: 400 900; src: url("fonts/orbitron.woff2") format("woff2"); }
  @font-face { font-family: "Rajdhani"; font-weight: 700; src: url("fonts/rajdhani700.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas#stage { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

await document.fonts.load("900 100px Orbitron");
await document.fonts.load("700 100px Rajdhani");

const W = 1920, H = 1080, DURATION = 15;
const RENDER_MODE = new URLSearchParams(location.search).has("render");

// ---------------------------------------------------------------- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const easeOutExpo = u => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
const easeInExpo = u => (u <= 0 ? 0 : Math.pow(2, 10 * u - 10));
const easeOutCubic = u => 1 - Math.pow(1 - u, 3);
const easeInCubic = u => u * u * u;
const easeInOutCubic = u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const easeInOutQuint = u => (u < 0.5 ? 16 * u ** 5 : 1 - Math.pow(-2 * u + 2, 5) / 2);
const easeOutBack = u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const C = hex => new THREE.Color(hex);
const hot = (hex, k) => new THREE.Color(hex).multiplyScalar(k);

const PAL = { cyan: "#27e8ff", blue: "#2f7bff", violet: "#8b3dff", magenta: "#ff2bd6", pink: "#ff5fa2", gold: "#ffc24a", white: "#ffffff" };

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: "high-performance" });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#010105");
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 4000);
scene.add(camera);

const composer = new EffectComposer(renderer);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.6, 0.4, 0.62);
composer.addPass(bloom);
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, flash: { value: 0 }, aberr: { value: 0.002 }, time: { value: 0 }, fade: { value: 0 }, flashTint: { value: new THREE.Color(1, 1, 1) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float flash, aberr, time, fade; uniform vec3 flashTint; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec2 d = vUv - 0.5;
      float r2 = dot(d,d);
      vec2 off = d * aberr * (1.0 + r2 * 6.0);
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;
      float vig = smoothstep(0.95, 0.25, length(d * vec2(1.0, 0.8)));
      col *= mix(0.55, 1.0, vig);
      col += (hash(vUv * vec2(1920.0,1080.0) + fract(time) * 91.7) - 0.5) * 0.025;
      col = mix(col, flashTint * 3.0, flash);
      col *= (1.0 - fade);
      gl_FragColor = vec4(col, 1.0);
    }`
});
composer.addPass(finalPass);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- background: nebula + far stars
const nebula = new THREE.Mesh(
  new THREE.SphereGeometry(1800, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { time: { value: 0 }, glow: { value: 1 } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform float time, glow; varying vec3 vDir;
      float h(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453); }
      float n3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
        return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x), mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x), mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y), f.z); }
      float fbm(vec3 p){ float a = 0.5, s = 0.0; for(int i=0;i<5;i++){ s += a*n3(p); p *= 2.03; a *= 0.5; } return s; }
      void main(){
        vec3 d = normalize(vDir);
        float n = fbm(d*2.6 + vec3(0.0, 0.0, time*0.015));
        float m = fbm(d*4.1 + vec3(3.7, time*0.01, 1.3));
        float band = exp(-pow(d.y*2.2 + 0.25*sin(d.x*3.0), 2.0));
        vec3 col = vec3(0.004, 0.003, 0.014);
        col += vec3(0.20, 0.04, 0.42) * pow(n, 2.6) * 0.8 * (0.5 + band);
        col += vec3(0.02, 0.22, 0.45) * pow(m, 3.2) * 0.65 * band;
        col += vec3(0.35, 0.05, 0.30) * pow(n*m, 3.0) * 0.5;
        gl_FragColor = vec4(col * glow, 1.0);
      }`
  })
);
scene.add(nebula);

(function farStars() {
  const r = rng(7), n = 5000, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = r() * 2 - 1, th = r() * Math.PI * 2, rad = 1200 + r() * 400, s = Math.sqrt(1 - u * u);
    pos.set([Math.cos(th) * s * rad, u * rad, Math.sin(th) * s * rad], i * 3);
    const c = new THREE.Color().setHSL(0.55 + r() * 0.25, 0.7, 0.6 + r() * 0.4).multiplyScalar(0.4 + Math.pow(r(), 6) * 2.5);
    col.set([c.r, c.g, c.b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2, sizeAttenuation: false, vertexColors: true, depthWrite: false, blending: THREE.AdditiveBlending, transparent: true })));
})();

// ---------------------------------------------------------------- warp streaks (camera-local)
const STREAKS = 2600, STREAK_DEPTH = 700;
const streak = (() => {
  const r = rng(11), base = [];
  for (let i = 0; i < STREAKS; i++) {
    const a = r() * Math.PI * 2, rad = 2.5 + Math.pow(r(), 0.7) * 140;
    const hue = r();
    const c = hue < 0.45 ? C(PAL.cyan) : hue < 0.8 ? C(PAL.violet) : hue < 0.93 ? C(PAL.white) : C(PAL.magenta);
    base.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad, z0: r() * STREAK_DEPTH, c, b: 0.35 + r() * 0.9 });
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(STREAKS * 6), 3));
  g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(STREAKS * 6), 3));
  const mesh = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  mesh.frustumCulled = false;
  camera.add(mesh);
  return { base, g, mesh };
})();

// warp speed profile (units / s) and its integral
function warpSpeed(t) {
  if (t < 0.3) return 1100;
  if (t < 1.25) return lerp(1100, 45, easeOutCubic(seg(t, 0.3, 1.25)));
  if (t < 1.75) return 45;
  if (t < 2.3) return lerp(45, 900, easeInCubic(seg(t, 1.75, 2.3)));
  if (t < 4.6) { const k = (t - 2.3) % 0.7667; return 110 + 700 * Math.exp(-k * 9); }
  if (t < 5.6) return lerp(700, 25, easeOutCubic(seg(t, 4.6, 5.6)));
  if (t < 10.3) return 25;
  if (t < 11.5) return lerp(25, 1600, easeInCubic(seg(t, 10.3, 11.5)));
  if (t < 12.4) return lerp(1600, 12, easeOutExpo(seg(t, 11.5, 12.4)));
  return 12;
}
const WARP_DT = 1 / 240, warpTable = [0];
for (let i = 1; i <= DURATION / WARP_DT + 2; i++) warpTable.push(warpTable[i - 1] + warpSpeed((i - 0.5) * WARP_DT) * WARP_DT);
const warpDist = t => { const f = t / WARP_DT, i = Math.floor(f); return lerp(warpTable[i], warpTable[i + 1], f - i); };

function updateStreaks(t, visibility) {
  const D = warpDist(t), sp = warpSpeed(t), len = clamp(sp * 0.045, 0.4, 90);
  const P = streak.g.attributes.position.array, Cc = streak.g.attributes.color.array;
  for (let i = 0; i < STREAKS; i++) {
    const s = streak.base[i];
    const z = -STREAK_DEPTH + ((s.z0 + D) % STREAK_DEPTH);
    const near = clamp(1 - (-z) / STREAK_DEPTH);
    const k = s.b * visibility * (0.15 + near * near * 1.6);
    P[i * 6] = s.x; P[i * 6 + 1] = s.y; P[i * 6 + 2] = z;
    P[i * 6 + 3] = s.x; P[i * 6 + 4] = s.y; P[i * 6 + 5] = z - len;
    Cc[i * 6] = s.c.r * k; Cc[i * 6 + 1] = s.c.g * k; Cc[i * 6 + 2] = s.c.b * k;
    Cc[i * 6 + 3] = 0; Cc[i * 6 + 4] = 0; Cc[i * 6 + 5] = 0;
  }
  streak.g.attributes.position.needsUpdate = true;
  streak.g.attributes.color.needsUpdate = true;
}

// ---------------------------------------------------------------- neon ribbons
const ribbonVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const ribbonFS = `
  uniform float prog, tail, opacity; uniform vec3 color; varying vec2 vUv;
  void main(){
    float d = prog - vUv.x;
    if (d < 0.0) discard;
    float a = (0.25 + 3.0 * exp(-d * 40.0)) * smoothstep(tail, 0.0, d);
    gl_FragColor = vec4(color * a * opacity, 1.0);
  }`;
function ribbonMaterial(color, tail = 0.5) {
  return new THREE.ShaderMaterial({
    uniforms: { prog: { value: 0 }, tail: { value: tail }, opacity: { value: 1 }, color: { value: hot(color, 1.5) } },
    vertexShader: ribbonVS, fragmentShader: ribbonFS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
  });
}
function ribbon(points, color, radius = 0.05, tail = 0.5, segs = 400) {
  const curve = new THREE.CatmullRomCurve3(points);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, radius, 6, false), ribbonMaterial(color, tail));
  m.frustumCulled = false;
  return m;
}

// ---------------------------------------------------------------- text
const texCache = new Map();
function glyphTexture(ch, font, px) {
  const key = ch + "|" + font + "|" + px;
  if (texCache.has(key)) return texCache.get(key);
  const c = document.createElement("canvas"), x = c.getContext("2d");
  x.font = `${font.replace("$", px + "px")}`;
  const w = Math.ceil(x.measureText(ch).width) + px * 0.5, h = Math.ceil(px * 1.5);
  c.width = w; c.height = h;
  x.font = `${font.replace("$", px + "px")}`;
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillStyle = "#fff";
  x.shadowColor = "rgba(255,255,255,0.55)"; x.shadowBlur = px * 0.06;
  x.fillText(ch, w / 2, h / 2 + px * 0.04);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const out = { tex, w, h };
  texCache.set(key, out);
  return out;
}
const letterVS = `varying vec2 vUv; varying float vWX; void main(){ vUv = uv; vec4 wp = modelMatrix * vec4(position,1.0); vWX = wp.x + wp.y * 0.35; gl_Position = projectionMatrix * viewMatrix * wp; }`;
const letterFS = `
  uniform sampler2D map; uniform vec3 colA, colB; uniform float opacity, sweep, glow; varying vec2 vUv; varying float vWX;
  void main(){
    vec4 t = texture2D(map, vUv);
    vec3 c = mix(colB, colA, smoothstep(0.2, 0.8, vUv.y));
    float s = exp(-pow((vWX - sweep) * 1.6, 2.0));
    c = c * glow + vec3(1.0) * s * 1.4;
    gl_FragColor = vec4(c * t.rgb, t.a * opacity);
  }`;
function makeWord(str, { size = 1, font = "900 $ Orbitron", tracking = 0.08, colA = PAL.white, colB = PAL.cyan, glow = 1.1 } = {}) {
  const px = 200, group = new THREE.Group(), letters = [];
  const meas = document.createElement("canvas").getContext("2d");
  meas.font = font.replace("$", px + "px");
  let x = 0;
  const items = [];
  for (const ch of str) {
    const adv = meas.measureText(ch).width / px * size;
    if (ch !== " ") items.push({ ch, cx: x + adv / 2 });
    x += adv + tracking * size;
  }
  const total = x - tracking * size;
  for (const it of items) {
    const g = glyphTexture(it.ch, font, px);
    const mat = new THREE.ShaderMaterial({
      uniforms: { map: { value: g.tex }, colA: { value: C(colA) }, colB: { value: C(colB) }, opacity: { value: 1 }, sweep: { value: -999 }, glow: { value: glow } },
      vertexShader: letterVS, fragmentShader: letterFS, transparent: true, depthWrite: false, side: THREE.DoubleSide
    });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(g.w / px * size, g.h / px * size), mat);
    m.userData.home = new THREE.Vector3(it.cx - total / 2, 0, 0);
    m.position.copy(m.userData.home);
    group.add(m); letters.push(m);
  }
  group.userData = { letters, width: total };
  return group;
}
function setWordUniform(word, name, v) { for (const l of word.userData.letters) l.material.uniforms[name].value = v; }

// ---------------------------------------------------------------- 2D channel content (procedural, animated)
function rr(x, X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
function badge(x, text, X, Y, bg, fg = "#fff", sc = 1) {
  x.font = `700 ${Math.round(22 * sc)}px Rajdhani`;
  const w = x.measureText(text).width + 22 * sc;
  rr(x, X, Y, w, 32 * sc, 6 * sc); x.fillStyle = bg; x.fill();
  x.fillStyle = fg; x.textBaseline = "middle"; x.textAlign = "left"; x.fillText(text, X + 11 * sc, Y + 17 * sc);
  return w;
}
const SPORT_PLAYERS = (() => { const r = rng(21), a = []; for (let i = 0; i < 20; i++) a.push({ u: r(), v: r(), p: r() * 6.28, f: 0.4 + r() * 0.8, team: i % 2 }); return a; })();
function drawSports(x, w, h, t) {
  const s = w / 1024, pan = Math.sin(t * 0.7) * 0.06;
  let g = x.createLinearGradient(0, 0, 0, h * 0.4); g.addColorStop(0, "#050a1c"); g.addColorStop(1, "#14203d");
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 4; i++) { const lx = (0.1 + i * 0.27 - pan) * w; const rg = x.createRadialGradient(lx, h * 0.06, 0, lx, h * 0.06, 110 * s); rg.addColorStop(0, "rgba(255,255,240,0.95)"); rg.addColorStop(1, "rgba(160,200,255,0)"); x.fillStyle = rg; x.fillRect(lx - 120 * s, 0, 240 * s, 180 * s); }
  const cr = rng(5); for (let i = 0; i < 900; i++) { const cx = ((cr() + 1 - pan) % 1) * w, cy = h * (0.2 + cr() * 0.16); x.fillStyle = `hsla(${cr() * 360},60%,${40 + cr() * 40 + (Math.sin(t * 9 + i) > 0.96 ? 40 : 0)}%,0.8)`; x.fillRect(cx, cy, 3 * s, 4 * s); }
  const top = h * 0.37, P = (u, v) => { const yy = top + (h - top) * v, half = lerp(0.36, 0.72, v) * w; return [w / 2 - pan * w * 0.8 + (u - 0.5) * 2 * half, yy]; };
  for (let i = 0; i < 10; i++) { const v0 = Math.pow(i / 10, 1.6), v1 = Math.pow((i + 1) / 10, 1.6); const a = P(-0.2, v0), b = P(1.2, v0), c = P(1.2, v1), d = P(-0.2, v1); x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.lineTo(...c); x.lineTo(...d); x.closePath(); x.fillStyle = i % 2 ? "#1f7a35" : "#238a3c"; x.fill(); }
  x.strokeStyle = "rgba(255,255,255,0.85)"; x.lineWidth = 3 * s;
  x.beginPath(); x.moveTo(...P(0, 0.02)); x.lineTo(...P(1, 0.02)); x.lineTo(...P(1, 1.05)); x.moveTo(...P(0, 1.05)); x.lineTo(...P(0, 0.02)); x.moveTo(...P(0.5, 0.02)); x.lineTo(...P(0.5, 1.05)); x.stroke();
  const cc = P(0.5, 0.42); x.beginPath(); x.ellipse(cc[0], cc[1], 120 * s, 42 * s, 0, 0, Math.PI * 2); x.stroke();
  for (const p of SPORT_PLAYERS) {
    const u = clamp(p.u + Math.sin(t * p.f + p.p) * 0.06 + Math.sin(t * 0.5) * 0.05, 0.03, 0.97), v = clamp(p.v * 0.9 + Math.cos(t * p.f * 0.8 + p.p) * 0.05, 0.02, 0.98);
    const [px, py] = P(u, v), sz = lerp(5, 13, v) * s;
    x.fillStyle = "rgba(0,0,0,0.35)"; x.beginPath(); x.ellipse(px, py, sz, sz * 0.35, 0, 0, 7); x.fill();
    x.fillStyle = p.team ? "#e8f0ff" : "#ff3b4f"; rr(x, px - sz * 0.55, py - sz * 2.6, sz * 1.1, sz * 2.4, sz * 0.4); x.fill();
    x.fillStyle = "#f2c9a0"; x.beginPath(); x.arc(px, py - sz * 2.9, sz * 0.45, 0, 7); x.fill();
  }
  const bu = 0.5 + Math.sin(t * 1.3) * 0.28, bv = 0.45 + Math.sin(t * 0.9) * 0.3, [bx, by] = P(bu, bv), hop = Math.abs(Math.sin(t * 5)) * 18 * s;
  x.fillStyle = "#fff"; x.beginPath(); x.arc(bx, by - hop - 5 * s, 6 * s, 0, 7); x.fill();
  // scoreboard
  rr(x, 28 * s, 26 * s, 330 * s, 52 * s, 10 * s); x.fillStyle = "rgba(6,10,28,0.85)"; x.fill();
  x.fillStyle = "#ff3b4f"; x.fillRect(28 * s, 26 * s, 8 * s, 52 * s);
  x.font = `700 ${30 * s}px Rajdhani`; x.textBaseline = "middle"; x.textAlign = "left"; x.fillStyle = "#fff";
  const sec = Math.floor(t * 7) % 60;
  x.fillText(`UNI  2 - 1  STR`, 50 * s, 53 * s); x.fillStyle = PAL.cyan; x.fillText(`78:${String(sec).padStart(2, "0")}`, 262 * s, 53 * s);
  const live = 0.6 + 0.4 * Math.sin(t * 8);
  badge(x, "● LIVE", w - 250 * s, 30 * s, `rgba(255,40,70,${0.75 + 0.25 * live})`, "#fff", s * 1.2);
  badge(x, "4K UHD", w - 140 * s, 30 * s, "rgba(39,232,255,0.9)", "#021018", s * 1.2);
}
const CITY = (() => { const r = rng(33), a = []; let X = 0; while (X < 1.3) { const bw = 0.012 + r() * 0.03; a.push({ x: X, w: bw, h: 0.05 + Math.pow(r(), 2) * 0.22, win: r() }); X += bw + 0.002; } return a; })();
function drawMovie(x, w, h, t) {
  const s = w / 1024;
  let g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#06122a"); g.addColorStop(0.3, "#1b3f6e"); g.addColorStop(0.52, "#ff8a3d"); g.addColorStop(0.62, "#ff4f5a"); g.addColorStop(1, "#1a0610");
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  const sx = w * 0.64, sy = h * (0.5 + t * 0.003);
  let rg = x.createRadialGradient(sx, sy, 0, sx, sy, h * 0.55); rg.addColorStop(0, "rgba(255,230,170,1)"); rg.addColorStop(0.08, "rgba(255,170,80,0.95)"); rg.addColorStop(0.3, "rgba(255,90,60,0.25)"); rg.addColorStop(1, "rgba(255,60,60,0)");

    }
    hudRings.forEach(g => { const [a, b] = windows[g.userData.kind]; g.visible = t > a && t < b; const e = easeOutBack(seg(t, a, a + 0.35)); g.scale.setScalar(Math.max(0.001, e)); g.children.forEach((r, i) => { r.rotation.z = t * (i % 2 ? -2.2 : 1.6) * (1 + i * 0.4); }); });
    wallRibbons.forEach(rb => { rb.material.uniforms.prog.value = lerp(-0.05, 1.4, seg(t, rb.userData.start, rb.userData.start + rb.userData.dur)); });
  }

  // ---- wormhole
  setVis(worm, t >= 10.45 && t < 11.62);
  if (worm.visible) worm.children.forEach((m, i) => { if (m.geometry.type === "TorusGeometry") m.rotation.z = i * 0.35 + t * (i % 2 ? 1.5 : -1.1); });

  // ---- logo
  setVis(logo, t >= 11.5);
  if (logo.visible) {
    const pl = easeOutBack(seg(t, 11.55, 12.25));
    planet.scale.setScalar(Math.max(0.001, pl)); planet.material.uniforms.time.value = t;
    planet.rotation.y = t * 0.4;
    orbitRing.material.uniforms.prog.value = lerp(0, 1.25, easeOutCubic(seg(t, 11.6, 12.5)));
    orbitRing2.material.uniforms.prog.value = lerp(0, 1.25, easeOutCubic(seg(t, 11.75, 12.7)));
    orbitRing.rotation.z = -0.32 + t * 0.05; orbitRing2.rotation.z = 0.42 - t * 0.04;
    const ca = t * 2.2; comet.position.set(Math.cos(ca) * 2.05, Math.sin(ca) * 2.05, 0).applyEuler(orbitRing.rotation); comet.visible = t > 12.3;
    const pp = easeOutBack(seg(t, 11.95, 12.45)); play.scale.setScalar(Math.max(0.001, pp)); play.rotation.y = (1 - easeOutExpo(seg(t, 11.95, 12.7))) * Math.PI * 2 + Math.sin(t * 1.2) * 0.12;
    emblem.position.y = 2.05 + Math.sin(t * 1.4) * 0.05;
    const allL = [...logoWord.userData.letters, ...logoIptv.userData.letters];
    allL.forEach((m, i) => {
      const u = seg(t, 12.05 + i * 0.045, 12.65 + i * 0.045), e = easeOutExpo(u);
      m.position.set(m.userData.home.x, (1 - e) * (i % 2 ? 2.5 : -2.5), lerp(-40, 0, e));
      m.rotation.set((1 - e) * (i % 2 ? 1.8 : -1.8), 0, 0);
      m.material.uniforms.opacity.value = clamp(u * 2.5);
      m.material.uniforms.sweep.value = lerp(-14, 14, seg(t, 13.25, 14.1));
    });
    const tu = easeOutExpo(seg(t, 12.85, 13.45));
    tagLine.scale.x = Math.max(0.001, tu * lockW); tagLineGlow.scale.x = Math.max(0.001, tu * lockW * 1.2); tagLineGlow.material.opacity = tu * 0.6;
    tagline.userData.letters.forEach((m, i) => { const u = easeOutCubic(seg(t, 13.05 + i * 0.03, 13.5 + i * 0.03)); m.material.uniforms.opacity.value = u; m.position.y = (1 - u) * -0.45; m.material.uniforms.sweep.value = lerp(-10, 10, seg(t, 13.9, 14.6)); });
    logoRibbons.forEach((rb, i) => { const c = (t - 12.1 - i * 0.12) * (0.55 + i * 0.05); rb.material.uniforms.prog.value = t < 12.1 + i * 0.12 ? -1 : (c % 1.3); rb.material.uniforms.opacity.value = 0.6; });
    const bu = seg(t, 12.0, 13.6), P = burst.g.attributes.position.array, Cc = burst.g.attributes.color.array;
    burst.pts.visible = bu > 0 && bu < 1;
    burst.dirs.forEach((d, i) => { const r = easeOutExpo(bu) * d.R; P[i * 3] = d.d.x * r; P[i * 3 + 1] = d.d.y * r; P[i * 3 + 2] = d.d.z * r; const k = (1 - bu) * 2.2; Cc[i * 3] = d.c.r * k; Cc[i * 3 + 1] = d.c.g * k; Cc[i * 3 + 2] = d.c.b * k; });
    burst.g.attributes.position.needsUpdate = true; burst.g.attributes.color.needsUpdate = true;
    const fl = Math.exp(-Math.pow((t - 12.3) * 4, 2)) + 0.35 * Math.exp(-Math.pow((t - 13.3) * 5, 2));
    flare.material.opacity = fl; flare.scale.set(0.3 + fl, 1 + fl * 0.5, 1);
  }

  // ---- post
  const rawFlash = Math.max(Math.exp(-Math.pow((t - 11.55) * 11, 2)), 0.4 * Math.exp(-Math.pow((t - 2.32) * 30, 2)), 0.3 * Math.exp(-Math.pow((t - 4.62) * 30, 2)), 0.2 * Math.exp(-Math.pow((t - 12.3) * 22, 2)));
  // flash is mixed in before tone mapping, so even small tails read as grey haze: cut them off
  const flash = clamp((rawFlash - 0.02) / 0.98);
  finalPass.uniforms.flash.value = clamp(flash);
  finalPass.uniforms.flashTint.value.set(t > 11 ? 0.85 : 0.8, 0.85, 1.0);
  finalPass.uniforms.aberr.value = 0.0015 + clamp(camSpeed / 900, 0, 0.012) + 0.01 * flash;
  finalPass.uniforms.time.value = t;
  finalPass.uniforms.fade.value = clamp(seg(t, 0, 0.18) < 1 ? 1 - seg(t, 0, 0.18) : 0) + seg(t, 14.72, 15.0);
  bloom.strength = 0.6 + 0.4 * flash + (t > 10.3 && t < 11.6 ? 0.4 : 0);

  composer.render();
}

window.renderAt = renderAt;

if (!RENDER_MODE) {
  const t0 = performance.now();
  const loop = () => { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
}
window.READY = true;
</script>
</body>
</html>
