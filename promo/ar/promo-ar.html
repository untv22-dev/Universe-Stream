<canvas id="stage" width="1920" height="1080"></canvas>
<script type="module">
await Promise.all(["900 80px Cairo", "700 80px Cairo", "80px Lalezar", "900 80px Orbitron"].map(f => document.fonts.load(f, "abc عربي 123")));

const W = 1920, H = 1080, DURATION = 15, FPS = 30;
const RENDER_MODE = new URLSearchParams(location.search).has("render");
const SUBFRAMES = RENDER_MODE ? 6 : 1, SHUTTER = 0.5 / FPS;

// ------------------------------------------------------------------ palette & copy
const P = { ink: "#0E0826", deep: "#1A0B45", violet: "#6C2BFF", cyan: "#1FE0FF", magenta: "#FF2E8B", yellow: "#FFD23F", white: "#FFFFFF", light: "#F4F0FF", wa: "#25D366", waDark: "#128C4B" };
const WHATSAPP = "+20 10 1741 1422";
const WEBSITE = "www.universeiptv-ar.com";

// ------------------------------------------------------------------ math & easing
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const eOutCubic = u => 1 - Math.pow(1 - u, 3);

const eOutBack = (u, s = 1.70158) => 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2);
const eOutElastic = u => (u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -10 * u) * Math.sin((u * 10 - 0.75) * (2 * Math.PI) / 3) + 1);
const spring = (u, f = 3.2, d = 5.5) => (u <= 0 ? 0 : 1 - Math.exp(-d * u) * Math.cos(f * Math.PI * u));
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, u) { const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(u)))).join(",")})`; }
function rgba(h, a) { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }

// ------------------------------------------------------------------ drawing helpers
function text(x, s, X, Y, o = {}) {
  x.save();
  x.font = o.font || `900 ${o.size || 80}px Cairo`;
  x.textAlign = o.align || "center"; x.textBaseline = "middle"; x.direction = o.dir || "rtl";
  if (o.alpha !== undefined) x.globalAlpha *= o.alpha;
  if (o.shadow) { x.shadowColor = o.shadow; x.shadowBlur = o.blur || 0; x.shadowOffsetY = o.sy || 0; }
  if (o.stroke) { x.lineWidth = o.lw || 6; x.strokeStyle = o.stroke; x.lineJoin = "round"; x.strokeText(s, X, Y); }
  if (o.color !== null) { x.fillStyle = o.color || "#fff"; x.fillText(s, X, Y); }
  x.restore();
}
function measure(x, s, font, dir = "rtl") { x.save(); x.font = font; x.direction = dir; const w = x.measureText(s).width; x.restore(); return w; }
function rrect(x, X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }

function sparkle(x, X, Y, r, col, rot = 0) {
  x.save(); x.translate(X, Y); x.rotate(rot); x.fillStyle = col; x.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * 0.28 : r; x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  x.closePath(); x.fill(); x.restore();
}
function playTri(x, X, Y, r, col) {
  x.save(); x.translate(X, Y); x.fillStyle = col; x.strokeStyle = col; x.lineJoin = "round"; x.lineWidth = r * 0.35;
  x.beginPath(); x.moveTo(-r * 0.45, -r * 0.62); x.lineTo(r * 0.68, 0); x.lineTo(-r * 0.45, r * 0.62); x.closePath(); x.fill(); x.stroke(); x.restore();
}
function dotGrid(x, col, gap, t, drift = 12, alpha = 0.18) {
  x.save(); x.fillStyle = col; x.globalAlpha *= alpha;
  const ox = (-t * drift) % gap, oy = (t * drift * 0.5) % gap;
  for (let yy = oy - gap; yy < H + gap; yy += gap) for (let xx = ox - gap; xx < W + gap; xx += gap) { x.beginPath(); x.arc(xx, yy, 2.4, 0, 7); x.fill(); }
  x.restore();
}
function blob(x, X, Y, R, t, col, seed = 1, wob = 0.12) {
  x.beginPath();
  for (let i = 0; i <= 64; i++) { const a = i / 64 * Math.PI * 2, r = R * (1 + wob * Math.sin(a * 3 + t * 2 + seed) * 0.6 + wob * 0.4 * Math.sin(a * 5 - t * 1.5 + seed * 2)); x.lineTo(X + Math.cos(a) * r, Y + Math.sin(a) * r); }
  x.closePath(); x.fillStyle = col; x.fill();
}
function squiggle(x, X0, X1, Y, amp, waves, prog, col, lw) {
  if (prog <= 0) return;
  x.save(); x.strokeStyle = col; x.lineWidth = lw; x.lineCap = "round"; x.lineJoin = "round"; x.beginPath();
  const n = 80, end = Math.floor(n * prog);

// analytic confetti burst: deterministic for any t
function confetti(x, t, t0, X, Y, n, seed, cols, power = 900, grav = 1600) {
  const u = t - t0; if (u <= 0 || u > 1.8) return;
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (r() - 0.5) * Math.PI * 1.7, v = power * (0.35 + r() * 0.8), spin = (r() - 0.5) * 18, kind = Math.floor(r() * 3), c = cols[Math.floor(r() * cols.length)], sz = 10 + r() * 14, drag = 1.8;
    const k = (1 - Math.exp(-drag * u)) / drag;
    const px = X + Math.cos(a) * v * k, py = Y + Math.sin(a) * v * k + 0.5 * grav * u * u * 0.55;
    const al = clamp(1 - (u - 1.1) / 0.7);
    x.save(); x.globalAlpha *= al; x.translate(px, py); x.rotate(spin * u); x.fillStyle = c;
    if (kind === 0) x.fillRect(-sz / 2, -sz / 4, sz, sz / 2);
    else if (kind === 1) { x.beginPath(); x.arc(0, 0, sz / 3, 0, 7); x.fill(); }
    else { x.beginPath(); x.moveTo(0, -sz / 2); x.lineTo(sz / 2, sz / 2); x.lineTo(-sz / 2, sz / 2); x.closePath(); x.fill(); }
    x.restore();

}
function ring(x, t, t0, X, Y, r0, r1, col, lw = 8, dur = 0.45) {
  const u = seg(t, t0, t0 + dur); if (u <= 0 || u >= 1) return;
  x.save(); x.strokeStyle = col; x.globalAlpha *= 1 - u; x.lineWidth = lw * (1 - u) + 1; x.beginPath(); x.arc(X, Y, lerp(r0, r1, eOutCubic(u)), 0, 7); x.stroke(); x.restore();
}

// ------------------------------------------------------------------ scene A: bouncing ball → screen (0 – 2.0 s)
const GROUND = 650;
function ballState(t) {
  let y, x = lerp(1250, 960, eOutCubic(seg(t, 0, 0.9)));
  if (t < 0.36) y = lerp(-90, GROUND, Math.pow(t / 0.36, 2));
  else if (t < 0.70) { const u = seg(t, 0.36, 0.70); y = GROUND - 300 * 4 * u * (1 - u); }
  else { const u = seg(t, 0.70, 0.92); y = GROUND - 120 * 4 * u * (1 - u); }
  let sq = 0; for (const ti of [0.36, 0.70, 0.92]) if (t >= ti) sq += Math.exp(-(t - ti) * 26) * (ti === 0.36 ? 1 : 0.75);
  const vy = Math.abs(ballYDeriv(t));
  return { x, y, sx: 1 + 0.5 * sq - 0.12 * clamp(vy / 3000), sy: 1 - 0.42 * sq + 0.22 * clamp(vy / 3000) };
}
function ballYDeriv(t) { if (t < 0.36) return 2 * (GROUND + 90) * t / (0.36 * 0.36); if (t < 0.70) { const u = seg(t, 0.36, 0.70); return 300 * 4 * (1 - 2 * u) / 0.34; } const u = seg(t, 0.70, 0.92); return 120 * 4 * (1 - 2 * u) / 0.22; }

function sceneA(x, t) {
  x.fillStyle = P.ink; x.fillRect(0, 0, W, H);
  dotGrid(x, P.violet, 48, t, 10, 0.35);
  if (t < 0.92) {
    const b = ballState(t), R = 38;
    x.save(); x.fillStyle = "rgba(0,0,0,0.35)"; x.beginPath(); x.ellipse(b.x, GROUND + R, R * 1.3 * (0.5 + 0.5 * (b.y + 90) / (GROUND + 90)), 10, 0, 0, 7); x.fill(); x.restore();
    tf(x, b.x, b.y + R * (1 - b.sy), 1, 0, () => { x.scale(b.sx, b.sy); x.fillStyle = P.yellow; x.beginPath(); x.arc(0, 0, R, 0, 7); x.fill(); x.fillStyle = "rgba(255,255,255,0.55)"; x.beginPath(); x.arc(-12, -14, 10, 0, 7); x.fill(); });
    for (const ti of [0.36, 0.70]) ring(x, t, ti, b.x, GROUND + R, 20, 150, P.yellow, 6, 0.35);
    return;
  }
  // morph into a screen, then expand to full frame
  const m = eOutBack(seg(t, 0.92, 1.28), 1.4), ex = eInOutCubic(seg(t, 1.72, 2.0));
  let w = lerp(76, 900, m), h = lerp(76, 506, m), r = lerp(38, 44, clamp(m));

  ring(x, t, 0.92, 960, GROUND, 40, 420, P.yellow, 10, 0.5);
  ring(x, t, 1.0, 960, 520, 200, 700, P.cyan, 6, 0.55);
  const col = mix(P.yellow, P.violet, seg(t, 0.92, 1.12));
  x.save(); x.shadowColor = "rgba(108,43,255,0.6)"; x.shadowBlur = 80 * (1 - ex); rrect(x, 960 - w / 2, cy - h / 2, w, h, r); x.fillStyle = col; x.fill(); x.restore();
  // screen chrome
  const chrome = seg(t, 1.1, 1.3) * (1 - ex);
  if (chrome > 0) {
    x.save(); x.globalAlpha *= chrome;
    [P.magenta, P.yellow, P.cyan].forEach((c, i) => { x.fillStyle = c; x.beginPath(); x.arc(960 + w / 2 - 44 - i * 34, cy - h / 2 + 40, 10, 0, 7); x.fill(); });
    x.fillStyle = "rgba(255,255,255,0.25)"; rrect(x, 960 - w / 2 + 60, cy + h / 2 - 56, w - 120, 10, 5); x.fill();
    x.fillStyle = P.yellow; rrect(x, 960 + w / 2 - 60 - (w - 120) * seg(t, 1.1, 2.0), cy + h / 2 - 56, (w - 120) * seg(t, 1.1, 2.0), 10, 5); x.fill();
    x.restore();
  }

  const pu = seg(t, 1.14, 1.6);
  if (pu > 0) {
    const s = eOutElastic(pu) * (1 - 0.08 * Math.sin(seg(t, 1.55, 1.72) * Math.PI)) * lerp(1, 3.2, eInCubic(seg(t, 1.72, 2.0)));
    const wig = Math.sin(t * 16) * 0.05 * (1 - seg(t, 1.2, 1.7));
    tf(x, 960, cy - 10, s, wig, () => {
      text(x, "جاهز؟", 0, 8, { font: "220px Lalezar", color: P.ink, alpha: 0.25 * (1 - ex) });
      text(x, "جاهز؟", 0, 0, { font: "220px Lalezar", color: P.white, alpha: 1 - seg(t, 1.8, 2.0) });

  sparkle(x, 960 + 380, 330, 26 * eOutBack(seg(t, 1.25, 1.5)) * (1 - ex), P.yellow, t * 2);

}

// ------------------------------------------------------------------ scene B: kinetic Arabic words (2.0 – 4.12 s)
const WORDS = [
  { s: "عالم", bg: P.violet, fg: P.white, accent: P.yellow },
  { s: "كامل", bg: P.cyan, fg: P.ink, accent: P.magenta },
  { s: "من الترفيه", bg: P.magenta, fg: P.white, accent: P.yellow },
  { s: "بين إيديك", bg: P.yellow, fg: P.ink, accent: P.violet },
];
const B0 = 2.0, BL = 0.5;
function drawWord(x, k, t) {
  const wd = WORDS[k], s0 = B0 + k * BL, u = (t - s0) / BL;

  for (let j = 3; j >= 1; j--) {
    const xo = posX(u - j * 0.07);
    tf(x, 960 + xo + j * 26, 500, sc, 0, () => text(x, wd.s, 0, 0, { font, color: null, stroke: wd.fg, lw: 5, alpha: 0.28 / j }));
  }
  tf(x, 960 + posX(u), 500, sc, 0, () => { text(x, wd.s, 0, 14, { font, color: rgba(P.ink, 0.18) }); text(x, wd.s, 0, 0, { font, color: wd.fg }); });
  x.restore();
  squiggle(x, 960 + tw / 2, 960 - tw / 2, 500 + fs * 0.52, 14, 5, eOutCubic(seg(u, 0.25, 0.75)), wd.accent, 16);
  // pop-in decorations
  const r = rng(40 + k);

    const a = r() * Math.PI * 2, rx = 640 + r() * 200, ry = 330 + r() * 80, X = 960 + Math.cos(a) * rx, Y = 500 + Math.sin(a) * ry, kind = j % 4, sz = 22 + r() * 26;
    const sp = spring(seg(u, 0.12 + j * 0.05, 0.62 + j * 0.05)), rot = t * (r() - 0.5) * 6;
    if (sp <= 0) continue;

      x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 8; x.lineCap = "round";
      if (kind === 0) { x.beginPath(); x.arc(0, 0, sz, 0, 7); x.stroke(); }
      else if (kind === 1) { x.beginPath(); x.moveTo(-sz, 0); x.lineTo(sz, 0); x.moveTo(0, -sz); x.lineTo(0, sz); x.stroke(); }

function sceneB(x, t) {

  const cur = WORDS[k], prev = WORDS[Math.max(0, k - 1)];

  drawWord(x, k, t);
  x.restore();

  text(x, `0${k + 1} / 04`, 120, 1010, { font: "700 34px Orbitron", dir: "ltr", color: rgba(cur.fg === P.white ? "#FFFFFF" : P.ink, 0.6) });
  text(x, "UNIVERSE IPTV", 1800, 1010, { font: "700 28px Orbitron", dir: "ltr", align: "right", color: rgba(cur.fg === P.white ? "#FFFFFF" : P.ink, 0.6) });
}
const BANDS = [P.yellow, P.cyan, P.magenta, P.ink], SKEW = 320, SWITCH_BC = 4.12;
function bandsTransition(x, t) {
  BANDS.forEach((c, i) => {
    let path;
    if (t < SWITCH_BC) {
      const u = eInOutCubic(seg(t, 3.78 + i * 0.045, 3.98 + i * 0.045)); if (u <= 0) return;

// ------------------------------------------------------------------ scene C: category cards + TV focus ring (4.12 – 7.05 s)
const CARDS = [
  { t: "مباريات مباشرة", s: "كل الدوريات الكبرى", a: "#12C8F0", b: "#5B2BFF", icon: "ball" },
  { t: "أحدث الأفلام", s: "أول بأول", a: "#FF2E8B", b: "#6C2BFF", icon: "clap" },
  { t: "مسلسلات", s: "عربي وأجنبي", a: "#FFB23F", b: "#FF2E8B", icon: "stack" },
  { t: "قنوات عالمية", s: "رياضة • أخبار • أطفال", a: "#8B5CFF", b: "#1E3BFF", icon: "globe" },

const CW = 360, CH = 450, CY = 620;
const cardX = i => 960 + (1.5 - i) * 400;
const FOCUS = [5.25, 5.6, 5.95, 6.3];
function drawIcon(x, kind, t, s) {

    const open = Math.max(0, Math.sin(t * 5)) * 0.5;

    x.fillStyle = "#fff"; for (let i = 0; i < 4; i++) { x.save(); x.beginPath(); x.rect(-80, -20, 160, 30); x.clip(); x.fillRect(-80 + i * 44, -20, 22, 30); x.restore(); }

  x.beginPath(); x.arc(0, 0, q, 0, 7); x.stroke(); x.beginPath(); x.ellipse(0, 0, q * 0.45, q, 0, 0, 7); x.stroke();
  x.beginPath(); x.moveTo(-q, 0); x.lineTo(q, 0); x.stroke(); x.restore();
}
function pointer(x, X, Y, s) {
  x.save(); x.translate(X, Y); x.scale(s, s); x.rotate(-0.12);
  x.beginPath(); [[0, 0], [0, 46], [12, 35], [21, 54], [30, 50], [21, 32], [37, 32]].forEach(([a, b]) => x.lineTo(a, b)); x.closePath();
  x.shadowColor = "rgba(0,0,0,0.4)"; x.shadowBlur = 10; x.shadowOffsetY = 5; x.fillStyle = "#fff"; x.fill();
  x.shadowColor = "transparent"; x.lineWidth = 3.5; x.strokeStyle = P.ink; x.lineJoin = "round"; x.stroke(); x.restore();
}
function sceneF(x, t) {
  spaceBG(x, t);
  // floating playful bits
  const r = rng(21);
  for (let i = 0; i < 14; i++) {
    const X = r() * W, sp = 30 + r() * 50, Y = H + 60 - ((r() * H + (t - F0) * sp) % (H + 120)), kind = i % 3, c = [P.cyan, P.magenta, P.yellow][i % 3];
    x.save(); x.globalAlpha *= 0.28 * seg(t, F0, F0 + 0.6);
    if (kind === 0) playTri(x, X, Y, 16, c); else if (kind === 1) sparkle(x, X, Y, 16, c, t); else { x.strokeStyle = c; x.lineWidth = 5; x.beginPath(); x.arc(X, Y, 14, 0, 7); x.stroke(); }
    x.restore();
  }
  // logo slides up into a compact header
  const m = eInOutCubic(seg(t, F0 - 0.1, F0 + 0.45)), s = lerp(1, 0.4, m), dy = lerp(0, -400, m);
  x.save(); x.translate(960, 540 + dy); x.scale(s, s); x.translate(-960, -540); drawLogo(x, t, E0); x.restore();
  // headline
  const hu = seg(t, F0 + 0.3, F0 + 0.9);
  if (hu > 0) {
    const bs = eOutBack(seg(t, F0 + 0.28, F0 + 0.7));
    tf(x, 960, 440, 1, -0.03, () => { rrect(x, -420 * bs, -88, 840 * bs, 176, 88); x.fillStyle = P.magenta; x.fill(); });
    tf(x, 960, 435, eOutElastic(hu), Math.sin(t * 7) * 0.02 * (1 - seg(t, F0 + 0.9, F0 + 1.4)), () => text(x, "اشترك الآن", 0, 0, { font: "150px Lalezar", color: "#fff", shadow: "rgba(0,0,0,0.3)", blur: 0, sy: 8 }));
    sparkle(x, 960 + 440, 370, 26 * eOutBack(seg(t, F0 + 0.6, F0 + 0.9)), P.yellow, t * 3);
    sparkle(x, 960 - 450, 510, 20 * eOutBack(seg(t, F0 + 0.7, F0 + 1.0)), P.cyan, -t * 3);
  }
  // WhatsApp pill
  const wu = seg(t, 12.15, 12.75), press = t > 14.0 ? 1 - 0.05 * Math.exp(-(t - 14.0) * 10) * Math.sin(Math.min(1, (t - 14.0) * 8) * Math.PI) : 1;
  const PW = 1000, PH = 150, PY = 628;
  if (wu > 0) {
    const sp = spring(wu, 2.4, 6);
    tf(x, 960 + (1 - sp) * 1200, PY, press, (1 - clamp(sp)) * 0.15, () => {
      x.save(); x.shadowColor = "rgba(37,211,102,0.55)"; x.shadowBlur = 50 + 20 * Math.sin(t * 5); x.shadowOffsetY = 10;
      const g = x.createLinearGradient(-PW / 2, 0, PW / 2, 0); g.addColorStop(0, P.waDark); g.addColorStop(1, P.wa);
      rrect(x, -PW / 2, -PH / 2, PW, PH, PH / 2); x.fillStyle = g; x.fill(); x.restore();
      // icon on the right (RTL), ringing wiggle
      const iu = eOutElastic(seg(t, 12.35, 12.85)), wig = (Math.exp(-Math.max(0, t - 13.4) * 5) * (t > 13.4) + Math.exp(-Math.max(0, t - 14.35) * 5) * (t > 14.35)) * Math.sin(t * 45) * 0.25;
      const IX = PW / 2 - 78;
      for (const rt of [13.4, 14.35]) { ring(x, t, rt, IX, 0, 60, 130, "#fff", 6, 0.5); ring(x, t, rt + 0.12, IX, 0, 60, 130, "#fff", 6, 0.5); }
      tf(x, IX, 0, iu, wig, () => waIcon(x, 0, 0, 56, t));
      text(x, "اشترك عبر واتساب", IX - 90, -36, { font: "700 34px Cairo", align: "right", color: "rgba(255,255,255,0.92)" });
      digitRoll(x, WHATSAPP, IX - 90, 24, t, 12.45);
    });
  }
  // website pill
  const su = seg(t, 12.65, 13.2), SY = 820, SW = measure(x, WEBSITE, "800 50px Cairo", "ltr") + 200, SH = 108;
  if (su > 0) {
    const sp = spring(su, 2.4, 6);
    tf(x, 960 - (1 - sp) * 1200, SY, 1, -(1 - clamp(sp)) * 0.12, () => {
      x.save(); x.shadowColor = "rgba(0,0,0,0.35)"; x.shadowBlur = 30; x.shadowOffsetY = 12; rrect(x, -SW / 2, -SH / 2, SW, SH, SH / 2); x.fillStyle = "#fff"; x.fill(); x.restore();
      globeIcon(x, SW / 2 - 58, 0, 38);
      const n = Math.floor(clamp(seg(t, 12.9, 13.65)) * WEBSITE.length), shown = WEBSITE.slice(0, n);
      const f = "800 50px Cairo", fullW = measure(x, WEBSITE, f, "ltr"), startX = SW / 2 - 118 - fullW;
      text(x, shown, startX, 2, { font: f, dir: "ltr", align: "left", color: P.ink });
      if (t < 13.9 && Math.floor(t * 4) % 2 === 0 || (t >= 12.9 && t < 13.65)) { const cw = measure(x, shown, f, "ltr"); x.fillStyle = P.violet; x.fillRect(startX + cw + 4, -28, 5, 56); }
    });
  }
  // cursor glides in and taps the WhatsApp pill
  const cu = eInOutCubic(seg(t, 13.35, 13.95));
  if (t > 13.35) {
    const X = lerp(1800, 1392, cu) + Math.sin(cu * Math.PI) * -80, Y = lerp(1120, PY + 18, cu) + Math.sin(cu * Math.PI) * 30;
    const cs = t > 14.0 ? 1 - 0.2 * Math.exp(-(t - 14.0) * 12) * (t < 14.3) : 1;
    ring(x, t, 14.0, X, Y, 10, 90, "#fff", 6, 0.4);
    pointer(x, X, Y, 1.5 * cs);
  }
  confetti(x, t, 12.2, 1400, PY, 60, 31, [P.wa, P.yellow, "#fff", P.cyan], 1000, 1500);
  confetti(x, t, 14.02, 1392, PY, 50, 33, [P.wa, P.yellow, "#fff", P.magenta], 900, 1500);
}
function digitRoll(x, str, rightX, Y, t, t0) {
  const f = "900 66px Cairo", total = measure(x, str, f, "ltr");
  let px = rightX - total;
  x.save(); x.beginPath(); x.rect(rightX - total - 20, Y - 42, total + 40, 84); x.clip();
  let di = 0;
  for (const ch of str) {
    const cw = measure(x, ch, f, "ltr");
    if (/\d/.test(ch)) {
      const u = seg(t, t0 + di * 0.035, t0 + 0.35 + di * 0.035), roll = (1 - eOutCubic(u)) * 9, fin = +ch;
      if (u > 0) {
        const k = Math.floor(roll), fr = roll - k;
        const d0 = (fin + k) % 10, d1 = (fin + k + 1) % 10;
        text(x, String(d0), px + cw / 2, Y + fr * 76, { font: f, dir: "ltr", color: "#fff" });
        if (fr > 0.001) text(x, String(d1), px + cw / 2, Y + fr * 76 - 76, { font: f, dir: "ltr", color: "#fff" });
      }
      di++;
    } else if (ch !== " ") {
      text(x, ch, px + cw / 2, Y, { font: f, dir: "ltr", color: "#fff", alpha: seg(t, t0, t0 + 0.15) });
    }
    px += cw;
  }
  x.restore();
}

// ------------------------------------------------------------------ frame composition
function camera(t) {
  let sx = 0, sy = 0, rot = 0, zoom = 1, fx = 960, fy = 540;
  const hits = [[2.0, 1], [2.5, 1], [3.0, 1], [3.5, 1], [E0 + 0.1, 1.6], [F0 + 0.3, 0.8], [14.0, 0.6]];
  for (const [h, a] of hits) if (t >= h) { const d = Math.exp(-(t - h) * 14) * a; sx += Math.sin(t * 90 + h) * 10 * d; sy += Math.cos(t * 77 + h) * 8 * d; zoom += 0.035 * d; }
  if (t > 3.99 && t < SWITCH_BC) zoom += 0.02;
  // D → E: dive into the TV screen
  if (t >= 9.18 && t < E0) {
    const u = eInOutCubic(seg(t, 9.15, 9.52)), d = DEV.tv, target = Math.max(W / d.w, H / d.h) * 1.03;
    zoom *= Math.exp(lerp(0, Math.log(target), u)); fx = lerp(960, DCX, u); fy = lerp(540, DCY, u);
  }
  return { sx, sy, rot, zoom, fx, fy };
}
function drawFrame(x, t) {
  x.save();
  const c = camera(t);
  x.translate(960 + c.sx, 540 + c.sy); x.rotate(c.rot); x.scale(c.zoom, c.zoom);
  x.translate(-c.fx, -c.fy);
  if (t < 2.0) sceneA(x, t);
  else if (t < SWITCH_BC) sceneB(x, t);
  else if (t < 7.05) {
    sceneC(x, t);
    const bu = eInCubic(seg(t, 6.72, 7.05));
    if (bu > 0) { x.save(); x.beginPath(); x.arc(cardX(3), CY, bu * 2300, 0, 7); x.clip(); sceneD(x, t); x.restore(); }
  } else if (t < E0) sceneD(x, t);
  else if (t < F0) sceneE(x, t);
  else sceneF(x, t);
  if (t > 3.7 && t < SWITCH_BC + 0.5) bandsTransition(x, t);
  x.restore();
}

// ------------------------------------------------------------------ render with sub-frame motion blur, grain and vignette
const stage = document.getElementById("stage"), out = stage.getContext("2d");
const acc = new OffscreenCanvas(W, H), ax = acc.getContext("2d");
const tmp = new OffscreenCanvas(W, H), tx = tmp.getContext("2d");
const grains = [0, 1, 2, 3].map(k => { const c = new OffscreenCanvas(256, 256), g = c.getContext("2d"), im = g.createImageData(256, 256), r = rng(100 + k); for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); return c; });
const vignette = (() => { const c = new OffscreenCanvas(W, H), g = c.getContext("2d"), gr = g.createRadialGradient(960, 540, 500, 960, 540, 1250); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,0.38)"); g.fillStyle = gr; g.fillRect(0, 0, W, H); return c; })();
function renderAt(t) {
  t = clamp(t, 0, DURATION - 1e-4);
  ax.globalAlpha = 1; ax.clearRect(0, 0, W, H);
  for (let i = 0; i < SUBFRAMES; i++) {
    const st = SUBFRAMES === 1 ? t : clamp(t - SHUTTER / 2 + SHUTTER * i / (SUBFRAMES - 1), 0, DURATION - 1e-4);
    tx.setTransform(1, 0, 0, 1, 0, 0); tx.globalAlpha = 1; tx.clearRect(0, 0, W, H);
    drawFrame(tx, st);
    ax.globalAlpha = 1 / (i + 1); ax.drawImage(tmp, 0, 0);
  }
  out.globalAlpha = 1; out.globalCompositeOperation = "source-over"; out.drawImage(acc, 0, 0);
  out.drawImage(vignette, 0, 0);
  out.globalCompositeOperation = "overlay"; out.globalAlpha = 0.07;
  const g = grains[Math.floor(t * FPS) % 4]; out.fillStyle = out.createPattern(g, "repeat"); out.fillRect(0, 0, W, H);
  out.globalCompositeOperation = "source-over"; out.globalAlpha = 1;
}
window.renderAt = renderAt;
if (!RENDER_MODE) { const t0 = performance.now(); const loop = () => { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
window.READY = true;
</script>
