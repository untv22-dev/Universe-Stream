name: Universe Stream Android Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  ANDROID_API: '36'
  BUILD_TOOLS: '35.0.0'

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > universe-stream-release.jks
          else
            echo "Production signing secrets are unavailable; generating an ephemeral CI key." >> "$GITHUB_STEP_SUMMARY"
            keytool -genkeypair -v -keystore universe-stream-release.jks -storetype JKS \
              -alias universestream-ci -keyalg RSA -keysize 2048 -validity 30 \
              -storepass ci-only-password -keypass ci-only-password \
              -dname 'CN=Universe Stream CI, OU=CI, O=Universe Stream, C=US'
            STORE_PASSWORD=ci-only-password
            KEY_ALIAS=universestream-ci
            KEY_PASSWORD=ci-only-password
          fi
          cat > keystore.properties <<EOF
          storeFile=universe-stream-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: |
          ./gradlew --no-daemon --max-workers=1 --console=plain --info \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            -Dkotlin.daemon.jvm.options="-Xmx1024m" \
            -Dorg.gradle.workers.max=1 \
            :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: universe-stream-release
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload mapping file when present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-stream-mapping
          if-no-files-found: ignore
          path: app/build/outputs/mapping/release/mapping.txt
