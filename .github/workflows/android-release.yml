name: Universe Stream Android Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: universe-stream-fast-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: '36'
  BUILD_TOOLS: '35.0.0'

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > universe-stream-release.jks
          else
            echo "Production signing secrets are unavailable; generating an ephemeral CI key." >> "$GITHUB_STEP_SUMMARY"
            keytool -genkeypair -v -keystore universe-stream-release.jks -storetype JKS \
              -alias universestream-ci -keyalg RSA -keysize 2048 -validity 30 \
              -storepass ci-only-password -keypass ci-only-password \
              -dname 'CN=Universe Stream CI, OU=CI, O=Universe Stream, C=US'
            STORE_PASSWORD=ci-only-password
            KEY_ALIAS=universestream-ci
            KEY_PASSWORD=ci-only-password
          fi
          cat > keystore.properties <<EOF
          storeFile=universe-stream-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Keep each test suite isolated so a slow module is visible and bounded.
      # A failing step stops the pipeline before Android-test compilation/APK build.
      - name: Run domain unit tests
        run: |
          timeout --signal=TERM --kill-after=60s 8m \
            ./gradlew --no-daemon --max-workers=2 --console=plain \
              -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
              -Dkotlin.daemon.jvm.options="-Xmx2g" \
              -Dorg.gradle.workers.max=2 \
              -Dorg.gradle.parallel=true \
              :domain:test --stacktrace

      - name: Run player unit tests
        run: |
          timeout --signal=TERM --kill-after=60s 8m \
            ./gradlew --no-daemon --max-workers=2 --console=plain \
              -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
              -Dkotlin.daemon.jvm.options="-Xmx2g" \
              -Dorg.gradle.workers.max=2 \
              -Dorg.gradle.parallel=true \
              :player:testDebugUnitTest --stacktrace

      - name: Run data unit tests
        run: |
          timeout --signal=TERM --kill-after=60s 12m \
            ./gradlew --no-daemon --max-workers=2 --console=plain \
              -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
              -Dkotlin.daemon.jvm.options="-Xmx2g" \
              -Dorg.gradle.workers.max=2 \
              -Dorg.gradle.parallel=true \
              :data:testDebugUnitTest --stacktrace

      - name: Run app unit tests
        run: |
          timeout --signal=TERM --kill-after=60s 15m \
            ./gradlew --no-daemon --max-workers=2 --console=plain \
              -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
              -Dkotlin.daemon.jvm.options="-Xmx2g" \
              -Dorg.gradle.workers.max=2 \
              -Dorg.gradle.parallel=true \
              :app:testDebugUnitTest --stacktrace

      - name: Compile Android UI tests
        run: |
          timeout --signal=TERM --kill-after=60s 10m \
            ./gradlew --no-daemon --max-workers=2 --console=plain \
              -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
              -Dkotlin.daemon.jvm.options="-Xmx2g" \
              -Dorg.gradle.workers.max=2 \
              -Dorg.gradle.parallel=true \
              :app:compileDebugAndroidTestKotlin --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            domain/build/reports/tests/
            player/build/reports/tests/
            data/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build signed release APK
        run: |
          # Fast development/review APK path: keep memory bounded while allowing
          # limited parallelism on GitHub-hosted runners. Coverage reporting stays
          # with the final release CI (release.yml).
          timeout --signal=TERM --kill-after=60s 27m \
            ./gradlew --no-daemon --max-workers=2 --console=plain \
              -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
              -Dkotlin.daemon.jvm.options="-Xmx2g" \
              -Dorg.gradle.workers.max=2 \
              -Dorg.gradle.parallel=true \
              -Dorg.gradle.vfs.watch=false \
              :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build-${{ github.run_number }}
          name: Universe Stream CI Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: app/build/outputs/apk/release/app-release.apk
